name: CI

on:
  # Pushes to main are covered by the Deploy workflow, which calls this one as
  # its gate. Running it here too would just duplicate every run.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Security, inside-out: fail the build on a known-vulnerable dependency.
      - name: Audit dependencies
        run: npm audit --audit-level=high
