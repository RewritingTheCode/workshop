name: CodeQL

# Static analysis of the source, run by GitHub. `npm audit` and Dependabot
# cover the code we did not write; this covers the code we did.
#
# The weekly schedule is the part that earns its keep on a template repo: a
# rule that lands in CodeQL six months from now still gets run against a fork
# that nobody has pushed to since the workshop. See ADR-007.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesday, early. Nothing here is time-sensitive; the point is that it runs
    # without a human remembering to run it.
    - cron: '17 6 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Scoped to the job, not the workflow: only this one needs to write
      # findings back, and nothing else in the file should be able to.
      security-events: write
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # `security-extended` over the default: this repo is small enough
          # that the extra queries cost a minute and not a backlog.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript
